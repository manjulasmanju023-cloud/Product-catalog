<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>MyStore</h1>
        <button id="cart-btn">Cart (<span id="cart-count">0</span>)</button>
    </header>

    <main>
        <section class="filters">
            <form id="filter-form">
                <div>
                    <label for="search">Search</label>
                    <input type="text" id="search" placeholder="Search products...">
                </div>
                <div>
                    <label for="category">Category</label>
                    <select id="category">
                        <option value="all">All Categories</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Clothing">Clothing</option>
                        <option value="Shoes">Shoes</option>
                    </select>
                </div>
                <div>
                    <label for="price">Max Price</label>
                    <input type="number" id="price" placeholder="Enter max price">
                </div>
                <div>
                    <label for="sort">Sort By</label>
                    <select id="sort">
                        <option value="default">Default</option>
                        <option value="low-high">Price: Low to High</option>
                        <option value="high-low">Price: High to Low</option>
                        <option value="name">Name A-Z</option>
                    </select>
                </div>
            </form>
        </section>

        <section>
            <div id="product-list" class="product-grid"></div>
            <p id="empty-state" style="display:none;">No products found.</p>
        </section>

        <section id="cart-section" class="cart">
            <h2>Shopping Cart</h2>
            <div id="cart-items"></div>
            <div class="cart-footer">
                <h3>Total: ₹<span id="cartTotal">0</span></h3>
                <button id="empty-cart-btn">Empty Cart</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
